<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>القائمة الرئيسية للعبة</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --primary: #22c55e;
      --text: #f8fafc;
      --accent: #334155;
    }

    /* الثيمات */
    body.theme-green { --primary: #22c55e; --bg-color: #052e16; --card-bg: #14532d; }
    body.theme-blue { --primary: #3b82f6; --bg-color: #0f172a; --card-bg: #1e293b; }
    body.theme-neon { --primary: #a855f7; --bg-color: #18181b; --card-bg: #27272a; }
    body.theme-gold { --primary: #eab308; --bg-color: #1c1917; --card-bg: #292524; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      transition: all 0.3s ease;
    }

    .container {
      background-color: var(--card-bg);
      padding: 30px;
      border-radius: 16px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
      color: var(--primary);
    }

    .section {
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--accent);
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input[type="text"], select {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--accent);
      background-color: rgba(255, 255, 255, 0.05);
      color: #fff;
      box-sizing: border-box;
      margin-bottom: 10px;
    }

    .theme-buttons {
      display: flex;
      gap: 10px;
      margin-top: 5px;
    }

    .theme-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      color: #fff;
    }

    .bg-green { background-color: #22c55e; }
    .bg-blue { background-color: #3b82f6; }
    .bg-neon { background-color: #a855f7; }
    .bg-gold { background-color: #eab308; }

    .checkbox-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }

    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .start-btn {
      width: 100%;
      padding: 14px;
      background-color: var(--primary);
      color: #000;
      font-size: 1.1rem;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 10px;
      transition: transform 0.2s, opacity 0.2s;
    }

    .start-btn:hover {
      opacity: 0.9;
      transform: scale(1.02);
    }
  </style>
</head>
<body class="theme-green">

  <div class="container">
    
    <!-- 1. اختيار الألوان (الثيم) -->
    <div class="section">
      <label>🎨 اختر المظهر (الثيم):</label>
      <div class="theme-buttons">
        <button class="theme-btn bg-green" onclick="setTheme('theme-green')">أخضر</button>
        <button class="theme-btn bg-blue" onclick="setTheme('theme-blue')">أزرق</button>
        <button class="theme-btn bg-neon" onclick="setTheme('theme-neon')">نيون</button>
        <button class="theme-btn bg-gold" onclick="setTheme('theme-gold')">ذهبي</button>
      </div>
    </div>

    <!-- 2. اسم اللعبة -->
    <div class="section">
      <h1 id="gameTitleDisplay">🎮 اسم اللعبة</h1>
      <label for="gameTitle">تعديل اسم اللعبة:</label>
      <input type="text" id="gameTitle" placeholder="ادخل اسم اللعبة..." oninput="updateTitle()">
    </div>

    <!-- 3. أسماء الأفرقة -->
    <div class="section">
      <label>👥 أسماء الأفرقة:</label>
      <input type="text" id="team1" placeholder="اسم الفريق الأول">
      <input type="text" id="team2" placeholder="اسم الفريق الثاني">
    </div>

    <!-- 4. عدد الجولات -->
    <div class="section">
      <label for="rounds">🔢 عدد الجولات:</label>
      <select id="rounds">
        <option value="3">3 جولات (سريعة)</option>
        <option value="5" selected>5 جولات (قياسية)</option>
        <option value="7">7 جولات (تحدي)</option>
      </select>
    </div>

    <!-- 5. الفئات والفئة المشتركة -->
    <div class="section">
      <label>📚 اختيار الفئات العامة:</label>
      <div class="checkbox-group">
        <div class="checkbox-item"><input type="checkbox" id="cat1" checked> <label for="cat1">رياضة</label></div>
        <div class="checkbox-item"><input type="checkbox" id="cat2" checked> <label for="cat2">ثقافة عامة</label></div>
        <div class="checkbox-item"><input type="checkbox" id="cat3"> <label for="cat3">ألعاب وسينما</label></div>
        <div class="checkbox-item"><input type="checkbox" id="cat4"> <label for="cat4">تاريخ وجغرافيا</label></div>
      </div>

      <label for="sharedCategory">🌟 الفئة المشتركة (الفاصلة):</label>
      <select id="sharedCategory">
        <option value="أسئلة عامة">أسئلة عامة</option>
        <option value="تحدي السرعة">تحدي السرعة</option>
        <option value="معلومات عامة">معلومات عامة</option>
      </select>
    </div>

    <!-- 6. وقت الإجابة -->
    <div class="section">
      <label for="timer">⏱️ وقت الإجابة لكل سؤال:</label>
      <select id="timer">
        <option value="15">15 ثانية (سريع)</option>
        <option value="30" selected>30 ثانية (معتاد)</option>
        <option value="60">60 ثانية (تفكير مريح)</option>
      </select>
    </div>

    <!-- زر البدء -->
    <button class="start-btn" onclick="startGame()">🚀 ابدأ اللعبة الآن</button>

  </div>

  <script>
    function setTheme(themeName) {
      document.body.className = themeName;
    }

    function updateTitle() {
      const inputVal = document.getElementById('gameTitle').value;
      document.getElementById('gameTitleDisplay').innerText = inputVal.trim() !== "" ? inputVal : "🎮 اسم اللعبة";
    }

    function startGame() {
      const gameData = {
        title: document.getElementById('gameTitle').value || "بدون عنوان",
        team1: document.getElementById('team1').value || "الفريق 1",
        team2: document.getElementById('team2').value || "الفريق 2",
        rounds: document.getElementById('rounds').value,
        sharedCategory: document.getElementById('sharedCategory').value,
        timeLimit: document.getElementById('timer').value
      };

      alert(`تم بدء اللعبة بنجاح!\n\nاسم اللعبة: ${gameData.title}\nالمواجهة: ${gameData.team1} vs ${gameData.team2}\nعدد الجولات: ${gameData.rounds}\nوقت الإجابة: ${gameData.timeLimit} ثانية`);
    }
  </script>
</body>
</html>
