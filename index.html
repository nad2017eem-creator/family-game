<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تجهيز اللعبة</title>
  <style>
    /* ==========================================================
       1. تعريف المتغيرات للثيمات بناءً على طلبك
       ========================================================== */
    
    /* 🟡 1. ثيم الذهبي والأسود (الخلفية أسود، الحدود/الأزرار ذهبي، النصوص أبيض) */
    .theme-gold-black {
      --bg-app: #0f0f0f;
      --card-bg: #1a1a1a;
      --card-border: #d4af37;
      --button-bg: #d4af37;
      --button-text: #ffffff;
      --text-color: #ffffff;
      --input-bg: #000000;
    }

    /* 🔵 2. الثيم الكحلي (الخلفية أبيض، العناصر كحلي، النصوص كحلية) */
    .theme-navy {
      --bg-app: #ffffff;
      --card-bg: #f8fafc;
      --card-border: #0a192f;
      --button-bg: #0a192f;
      --button-text: #0a192f;
      --text-color: #0a192f;
      --input-bg: #e2e8f0;
    }

    /* 🔴🟢 3. ثيم الأحمر والأخضر (العناوين/الحدود أخضر، الاختيارات أحمر، النصوص أبيض) */
    .theme-red-green {
      --bg-app: #0a120c;
      --card-bg: #112217;
      --card-border: #2e7d32; /* أخضر */
      --button-bg: #c62828;   /* أحمر */
      --button-text: #ffffff; /* أبيض */
      --text-color: #ffffff;   /* أبيض */
      --input-bg: #000000;
    }

    /* ==========================================================
       2. تنسيقات واجهة التطبيق
       ========================================================== */
    body {
      margin: 0;
      padding: 20px;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      background-color: #222;
    }

    /* كبسولة الجوال / الشاشة */
    .mobile-screen {
      width: 100%;
      max-width: 380px;
      background-color: var(--bg-app);
      border-radius: 30px;
      padding: 20px;
      box-sizing: border-box;
      color: var(--text-color);
      transition: all 0.3s ease;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    /* الهيدر والكأس */
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .trophy {
      font-size: 50px;
    }
    .sub-title {
      font-size: 14px;
      opacity: 0.9;
      margin-top: 10px;
    }

    /* البطاقات (Cards) */
    .card {
      border: 2px solid var(--card-border);
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 15px;
      margin-bottom: 15px;
      position: relative;
    }

    /* أرقام الخطوات (1, 2, 3) */
    .step-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background-color: var(--card-border);
      color: var(--bg-app);
      font-weight: bold;
      width: 24px;
      height: 24px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* حقل الإدخال */
    .input-box {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      background-color: var(--input-bg);
      color: var(--text-color);
      box-sizing: border-box;
      text-align: center;
      font-size: 16px;
    }

    /* الشبكة للاختيارات (الجولات) */
    .options-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 15px;
    }

    /* زر الاختيار */
    .option-btn {
      border: 1.5px solid var(--card-border);
      border-radius: 10px;
      padding: 12px 5px;
      text-align: center;
      background: transparent;
      color: var(--text-color);
      font-size: 12px;
      cursor: pointer;
    }

    /* الزر المحدد/المختار */
    .option-btn.selected {
      background-color: var(--button-bg);
      color: var(--button-text);
      border-color: var(--button-bg);
      font-weight: bold;
    }

    /* أزرار التبديل للتجربة فقط */
    .theme-selector {
      text-align: center;
      margin-bottom: 15px;
    }
    .theme-selector button {
      padding: 5px 10px;
      margin: 2px;
      cursor: pointer;
      border-radius: 5px;
      border: none;
    }
  </style>
</head>
<body>

  <div>
    <!-- أزرار سريعة تجرّب منها الثيمات الثلاثة -->
    <div class="theme-selector">
      <button onclick="setTheme('theme-gold-black')">ذهبي وأسود</button>
      <button onclick="setTheme('theme-navy')">كحلي</button>
      <button onclick="setTheme('theme-red-green')">أحمر وأخضر</button>
    </div>

    <!-- الشاشة (تتغير كلاساتها للتحكم بالثيم) -->
    <div id="screen" class="mobile-screen theme-gold-black">
      
      <!-- الكأس والترويسة -->
      <div class="header">
        <div class="trophy">🏆</div>
        <div class="sub-title">الإجابة الأشهر = 1 نقطة، والأقل شهرة = 10 نقاط.</div>
      </div>

      <!-- الخطوة 1 -->
      <div class="card">
        <div class="step-badge">1</div>
        <input type="text" class="input-box" value="مثلاً: تحدي العائلة" readonly>
      </div>

      <!-- الخطوة 2 -->
      <div class="card">
        <div class="step-badge">2</div>
        <div style="font-size: 12px; margin-top: 10px; opacity: 0.8;">
          اختاروا عدد الجولات أولاً. بعدها تتغير عدد الفئات المطلوبة تلقائياً.
        </div>
        <div class="options-grid">
          <div class="option-btn">3 جولات</div>
          <div class="option-btn">5 جولات</div>
          <div class="option-btn selected">7 جولات</div>
          <div class="option-btn">10 جولات</div>
        </div>
      </div>

      <!-- الخطوة 3 -->
      <div class="card">
        <div class="step-badge">3</div>
        <div style="height: 20px;"></div>
      </div>

    </div>
  </div>

  <script>
    // دالة لتبديل الثيم عند الضغط على الأزرار
    function setTheme(themeName) {
      const screen = document.getElementById('screen');
      screen.className = 'mobile-screen ' + themeName;
    }
  </script>

</body>
</html>
